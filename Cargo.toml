[package]
name = "opcore-simplify"
version = "0.1.0"
edition = "2021"
description = "Generate an OpenCore EFI for the detected hardware"
license = "MIT"
authors = ["opcore-simplify"]

[dependencies]
anyhow = "1"
plist = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
zip = "2"

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.deb]
maintainer = "opcore-simplify"
section = "utils"
priority = "optional"
assets = [["target/release/opcore-simplify", "usr/bin/", "755"]]

[package.metadata.generate-rpm]
assets = [{ source = "target/release/opcore-simplify", dest = "/usr/bin/opcore-simplify", mode = "755" }]
