[package]
name = "opcore-builder"
version = "1.0.0"
edition = "2021"
description = "Generate an OpenCore EFI for the detected hardware"
license = "MIT"
authors = ["opcore-builder"]

[dependencies]
anyhow = "1"
plist = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
zip = "2"

[profile.release]
opt-level = 3
lto = true
strip = true

[package.metadata.deb]
maintainer = "opcore-builder"
section = "utils"
priority = "optional"
assets = [["target/release/opcore-builder", "usr/bin/", "755"]]

[package.metadata.generate-rpm]
assets = [{ source = "target/release/opcore-builder", dest = "/usr/bin/opcore-builder", mode = "755" }]
